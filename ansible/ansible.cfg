[defaults]
# Inventory file
inventory = inventory/hosts.yml

# Roles path
roles_path = roles

# Don't create .retry files
retry_files_enabled = False

# Use YAML callback for better output
stdout_callback = yaml

# Show task timing
callback_whitelist = profile_tasks, timer

# Logging (will be created by bootstrap.sh with sudo)
#log_path = /var/log/ansible-dotfiles.log

# SSH settings (even though we're running locally)
host_key_checking = False

# Performance
forks = 5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Display
display_skipped_hosts = False
display_ok_hosts = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[connection]
# Use local connection for localhost
transport = local
