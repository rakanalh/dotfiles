---
# Repository definitions for third-party packages

# RPM Fusion repositories
rpmfusion_free_url: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_version }}.noarch.rpm"
rpmfusion_nonfree_url: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_version }}.noarch.rpm"

# COPR repositories (enable based on feature flags)
copr_repos:
  - name: atim/starship
    enabled: "{{ enable_shell_tools }}"
    description: "Starship prompt"

  - name: chrisbouchard/neovide-nightly
    enabled: "{{ enable_editors }}"
    description: "Neovide (Neovim GUI)"

  - name: scottames/ghostty
    enabled: "{{ enable_shell_tools }}"
    description: "Ghostty terminal emulator"

# Third-party repositories
third_party_repos:
  # Docker CE
  - name: docker-ce-stable
    description: "Docker CE Stable - $basearch"
    baseurl: "https://download.docker.com/linux/fedora/$releasever/$basearch/stable"
    gpgkey: "https://download.docker.com/linux/fedora/gpg"
    gpgcheck: true
    enabled: "{{ dev_containers_enabled }}"

  # Tailscale
  - name: tailscale-stable
    description: "Tailscale stable"
    baseurl: "https://pkgs.tailscale.com/stable/fedora/$basearch"
    gpgkey: "https://pkgs.tailscale.com/stable/fedora/repo.gpg"
    gpgcheck: true
    enabled: "{{ enable_networking }}"

  # Google Chrome
  - name: google-chrome
    description: "Google Chrome"
    baseurl: "http://dl.google.com/linux/chrome/rpm/stable/$basearch"
    gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
    gpgcheck: true
    enabled: "{{ enable_browsers }}"

# VS Code repo (might be needed if not using flatpak)
vscode_repo:
  name: vscode
  description: "Visual Studio Code"
  baseurl: "https://packages.microsoft.com/yumrepos/vscode"
  gpgkey: "https://packages.microsoft.com/keys/microsoft.asc"
  gpgcheck: true
  enabled: false  # Using flatpak/insiders version instead
